<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Career Assessment System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>

<div class="reg-page">
    <div class="reg-card">

        <!-- Logo -->
        <div class="text-center mb-3">
            <a href="index.html">
                <img src="assets/images/logo.jpg" alt="Logo" class="reg-logo">
            </a>
        </div>

        <!-- Heading -->
        <h4 class="reg-title">Create Account</h4>
        <p class="reg-sub" id="regSub">Start your career journey today.</p>

        <!-- Role Toggle -->
        <div class="role-toggle mb-4">
            <input type="radio" id="roleUser" name="role" value="user" checked onchange="toggleRole()">
            <label for="roleUser" class="role-btn"><i class="bi bi-person-fill me-1"></i> Student</label>
            
            <input type="radio" id="roleAdmin" name="role" value="admin" onchange="toggleRole()">
            <label for="roleAdmin" class="role-btn"><i class="bi bi-shield-lock-fill me-1"></i> Admin</label>
        </div>

        <!-- Form -->
        <form id="registerForm" novalidate>
            <div class="row g-2">

                <!-- Full Name + Email -->
                <div class="col-md-6">
                    <label class="reg-label">Full Name</label>
                    <div class="input-wrap">
                        <i class="bi bi-person"></i>
                        <input type="text" class="reg-input" placeholder="Your full name" required name="full_name">
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="reg-label">Email Address</label>
                    <div class="input-wrap">
                        <i class="bi bi-envelope"></i>
                        <input type="email" class="reg-input" placeholder="Your email" required name="email">
                    </div>
                </div>

                <!-- Password -->
                <div class="col-md-12" id="passwordCol">
                    <label class="reg-label">Password</label>
                    <div class="input-wrap">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="reg-input" placeholder="Create a password" required id="pwd" name="password">
                        <button type="button" class="pwd-toggle" onclick="togglePwd()"><i class="bi bi-eye" id="eyeIcon"></i></button>
                    </div>
                </div>

                <!-- Student Specific Fields -->
                <div id="studentFields" class="row g-2 m-0 p-0">
                    <!-- Age -->
                    <div class="col-md-4">
                        <label class="reg-label">Age</label>
                        <div class="input-wrap">
                            <i class="bi bi-calendar3"></i>
                            <input type="number" class="reg-input" placeholder="Age" required min="10" max="100" name="age" id="ageInput">
                        </div>
                    </div>
                    <!-- Education Level -->
                    <div class="col-md-4">
                        <label class="reg-label">Education Level</label>
                        <div class="input-wrap">
                            <i class="bi bi-book"></i>
                            <select class="reg-input reg-select" required name="education_level" id="eduInput">
                                <option value="" disabled selected>Select level</option>
                                <option value="10th">Class 10</option>
                                <option value="12th">Class 12</option>
                                <option value="diploma">Diploma</option>
                                <option value="bachelors">Bachelor's</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <!-- Phone Number -->
                    <div class="col-md-4">
                        <label class="reg-label">Phone Number</label>
                        <div class="input-wrap">
                            <i class="bi bi-telephone"></i>
                            <input type="tel" class="reg-input" placeholder="Phone Number" required name="phone_number" id="phoneInput">
                        </div>
                    </div>
                </div>

                <!-- Admin Specific Fields -->
                <div id="adminFields" class="row g-2 m-0 p-0" style="display:none;">
                    <div class="col-md-12">
                        <label class="reg-label">Company ID <span style="color:#ef4444;font-size:12px;">* Required for Admin</span></label>
                        <div class="input-wrap">
                            <i class="bi bi-building"></i>
                            <input type="password" class="reg-input" placeholder="Enter authorized Company ID" name="company_id" id="companyInput">
                        </div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">
                            <i class="bi bi-info-circle"></i> This ID will be securely validated by the backend.
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="col-12 mt-1">
                    <button type="submit" class="btn-register">
                        Register <i class="bi bi-arrow-right ms-2"></i>
                    </button>
                </div>

                <!-- Divider -->
                <div class="col-12">
                    <div class="reg-divider">
                        <span></span><p>or</p><span></span>
                    </div>
                </div>

                <!-- Google Button -->
                <div class="col-12">
                    <div id="google-btn-container" class="w-100 d-flex justify-content-center"></div>
                </div>

            </div>
        </form>

        <p class="reg-login-link">Already have an account? <a href="login/login.html">Log In</a></p>

    </div>
</div>

<script>
    function togglePwd() {
        const input = document.getElementById('pwd');
        const icon  = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }

    function toggleRole() {
        const isAdmin = document.getElementById('roleAdmin').checked;
        const studentFields = document.getElementById('studentFields');
        const adminFields = document.getElementById('adminFields');
        const regSub = document.getElementById('regSub');
        
        if (isAdmin) {
            // Show Admin, Hide Student
            studentFields.style.display = 'none';
            adminFields.style.display = 'flex';
            
            // Remove required from student
            document.getElementById('ageInput').removeAttribute('required');
            document.getElementById('eduInput').removeAttribute('required');
            document.getElementById('phoneInput').removeAttribute('required');
            
            // Add required to admin
            document.getElementById('companyInput').setAttribute('required', 'true');
            
            regSub.textContent = "Sign in to manage the platform.";
        } else {
            // Show Student, Hide Admin
            studentFields.style.display = 'flex';
            adminFields.style.display = 'none';
            
            // Add required to student
            document.getElementById('ageInput').setAttribute('required', 'true');
            document.getElementById('eduInput').setAttribute('required', 'true');
            document.getElementById('phoneInput').setAttribute('required', 'true');
            
            // Remove required from admin
            document.getElementById('companyInput').removeAttribute('required');
            
            regSub.textContent = "Start your career journey today.";
        }
    }
</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <!-- api.js must come before register.js -->
    <script src="/assets/js/api.js"></script>
    <script src="register.js"></script>
    
    <!-- Google Translate Integration -->
    <script src="./assets/js/translate.js"></script>
</body>
</html>

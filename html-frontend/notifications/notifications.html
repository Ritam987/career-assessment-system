<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Career Assessment System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="notifications.css">
</head>
<body>

<div class="app-shell">

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- â”€â”€â”€ Sidebar â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <a href="../index.html">
                <img src="../assets/images/logo.jpg" alt="Career Assessment" class="brand-logo">
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="../dashboard/dashboard.html" class="nav-item"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
            <a href="../assessment-intro/intro.html" class="nav-item"><i class="bi bi-pencil-square"></i><span>Take Assessment</span></a>
            <a href="../results/results.html" class="nav-item"><i class="bi bi-bar-chart-line"></i><span>My Results</span></a>
            <a href="../notifications/notifications.html" class="nav-item active"><i class="bi bi-bell"></i><span>Notifications</span><span class="nav-badge" id="sidebarBadge">3</span></a>
            <a href="../profile/profile.html" class="nav-item"><i class="bi bi-person"></i><span>My Profile</span></a>
            <a href="#" class="nav-item"><i class="bi bi-gear"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer">
                        <div class="lang-switcher">
                <i class="bi bi-globe2"></i>
                <div class="lang-switcher-wrapper">
                    <select id="langSelect" onchange="changeLanguage(this.value)">
                        <option value="en">English</option>
                        <option value="hi">&#2361;&#2367;&#2306;&#2342;&#2368;</option>
                        <option value="bn">&#2476;&#2494;&#2434;&#2482;&#2494;</option>
                    </select>
                </div>
            </div>
<a href="../help/help.html" class="nav-item"><i class="bi bi-question-circle"></i><span>Help & Support</span></a>
            <a href="../login/login.html" class="nav-item logout"><i class="bi bi-box-arrow-left"></i><span>Logout</span></a>
            <div class="help-card">
                <div class="help-icon"><i class="bi bi-headset"></i></div>
                <p class="help-title">Need Help?</p>
                <p class="help-sub">We're here to help anytime.</p>
                <button class="help-btn" onclick="window.location.href='../help/help.html'">Contact Support</button>
            </div>
        </div>
    </aside>

    <!-- â”€â”€â”€ Main â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ -->
    <div class="main">

        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
                <nav class="breadcrumb-nav">
                    <a href="../dashboard/dashboard.html" class="breadcrumb-link">Dashboard</a>
                    <i class="bi bi-chevron-right breadcrumb-sep"></i>
                    <span class="breadcrumb-current">Notifications</span>
                </nav>
            </div>
            <div class="topbar-right">
                <button class="notif-btn">
                    <i class="bi bi-bell"></i>
                    <span class="notif-dot" id="topbarDot"></span>
                </button>
                <div class="user-chip dropdown" data-bs-toggle="dropdown">
                    <div class="user-avatar"><i class="bi bi-person-fill"></i></div>
                    <span>Name</span>
                    <i class="bi bi-chevron-down"></i>
                </div>
                <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-1 rounded-3">
                    <li><a class="dropdown-item small py-2" href="../profile/profile.html"><i class="bi bi-person me-2"></i>Profile</a></li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li><a class="dropdown-item small py-2 text-danger" href="../login/login.html"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
                </ul>
            </div>
        </header>

        <!-- Content -->
        <div class="content">

            <!-- Page Header -->
            <div class="page-header">
                <div>
                    <h3 class="page-title">Notifications</h3>
                    <p class="page-sub">Stay updated with your assessment activity</p>
                </div>
                <button class="mark-all-btn" onclick="markAllRead()">
                    <i class="bi bi-check2-all"></i> Mark all as read
                </button>
            </div>

            <!-- Filter Tabs -->
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterNotifs('all', this)">
                    All <span class="tab-count" id="countAll">6</span>
                </button>
                <button class="filter-tab" onclick="filterNotifs('unread', this)">
                    Unread <span class="tab-count unread" id="countUnread">3</span>
                </button>
                <button class="filter-tab" onclick="filterNotifs('read', this)">
                    Read <span class="tab-count" id="countRead">3</span>
                </button>
            </div>

            <!-- Notifications List -->
            <div class="notif-list" id="notifList"></div>

            <!-- Empty State (hidden by default) -->
            <div class="empty-state d-none" id="emptyState">
                <i class="bi bi-bell-slash"></i>
                <h5>No notifications here</h5>
                <p>You're all caught up!</p>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="notifications.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Career Assessment</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Page CSS -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="min-vh-100 d-flex justify-content-center align-items-center py-3">
        <div class="card auth-card bg-white">
            <div class="card-body p-4">
                
                <!-- Logo -->
                <div class="text-center mb-3">
                    <a href="../index.html">
                        <img src="../assets/images/logo.jpg" alt="Career Assessment Logo" class="login-logo">
                    </a>
                </div>

                <!-- Heading -->
                <div class="text-center mb-3">
                    <h4 class="fw-bold mb-1 text-dark">Welcome Back</h4>
                    <p class="text-muted small mb-0">Please login to your account</p>
                </div>

                <!-- Login Form -->
                <div class="role-selector mb-4">
                    <p class="role-label">I am a...</p>
                    <div class="d-flex gap-3">
                        <input type="radio" id="roleUser" name="role" value="user" checked>
                        <label for="roleUser" class="role-btn"><i class="bi bi-person-fill me-1"></i> Student</label>
                        
                        <input type="radio" id="roleAdmin" name="role" value="admin">
                        <label for="roleAdmin" class="role-btn"><i class="bi bi-shield-lock-fill me-1"></i> Admin</label>
                    </div>
                </div>
                <form id="loginForm">
                    
                    <!-- Email Address -->
                    <div class="mb-3">
                        <label class="form-label mb-1">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label mb-1">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="loginBtn" class="btn btn-login text-white w-100 d-flex justify-content-between align-items-center mb-3 rounded-3 shadow-sm py-2">
                        <span class="mx-auto">Login</span>
                        <i class="bi bi-box-arrow-in-right"></i>
                    </button>

                    <!-- Google Login Button Container -->
                    <div id="google-btn-container" class="w-100 d-flex justify-content-center mb-3"></div>

                    <!-- Divider -->
                    <div class="d-flex align-items-center justify-content-center mb-3">
                        <div class="divider-line" style="flex-grow:1; height:1px; background:#e2e8f0;"></div>
                        <span class="mx-3 text-muted" style="font-size: 0.8rem;">or</span>
                        <div class="divider-line" style="flex-grow:1; height:1px; background:#e2e8f0;"></div>
                    </div>

                    <!-- Register Link -->
                    <div class="text-center">
                        <span class="text-muted" style="font-size: 0.85rem;">Don't have an account? </span>
                        <a href="../register.html" class="register-link" style="font-size: 0.85rem;">Sign Up</a>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>
    <!-- api.js MUST come before login.js -->
    <script src="/assets/js/api.js"></script>
    <script src="login.js"></script>
    
    <!-- Google Translate Integration -->
    <script src="../assets/js/translate.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin-base.css">
    <link rel="stylesheet" href="careers.css">
</head>
<body>
<div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="../../assets/images/logo.jpg" alt="Logo" class="brand-logo-sm">
            <div class="brand-text">
                <div class="brand-name" data-i18n="common:career_assessment">Career Assessment</div>
                <div class="brand-role"><span class="admin-dot"></span><span data-i18n="admin:sidebar.admin_portal">Admin Portal</span></div>
            </div>
        </div>
        <div id="sidebarNav"></div>
        <div class="sidebar-footer">
            <a href="../../login/login.html" class="nav-item logout" data-tip="Logout">
                <i class="bi bi-box-arrow-right"></i>
                <span class="nav-lbl" data-i18n="admin:sidebar.logout">Logout</span>
            </a>
        </div>
    </aside>
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="openSidebar()"><i class="bi bi-list"></i></button>
                <button class="collapse-btn" onclick="toggleCollapse()"><i class="bi bi-layout-sidebar"></i></button>
                <span class="topbar-title" data-i18n="admin:sidebar.careers">Careers</span>
            </div>
            <div class="topbar-right">
                <a href="../notifications/notifications.html" class="icon-btn text-decoration-none"><i class="bi bi-bell"></i></a>
                <div class="dropdown">
                    <div class="user-chip" data-bs-toggle="dropdown" style="cursor:pointer;">
                        <div class="user-avatar">A</div>
                        <div class="user-info"><div class="u-name admin-name">Admin</div><div class="u-role"><span data-i18n="admin:sidebar.super_admin">Super Admin</span></div></div>
                    </div>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1" data-i18n="admin:careers.title">Career Profiles</h2>
                    <p class="text-muted mb-0" data-i18n="admin:careers.subtitle">Manage recommended career paths and roles.</p>
                </div>
               
            </div>
            
            <div class="panel">
                <div class="panel-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="careersTable">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th data-i18n="admin:careers.table_name">Career Name</th>
                                    <th data-i18n="admin:careers.table_domain">Skill Domain</th>
                                    <th data-i18n="admin:careers.table_created">Created On</th>
                                    <th class="text-end" data-i18n="admin:careers.table_actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="5" class="text-center py-4"><span data-i18n="common:loading">Loading...</span></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Career Modal -->
<div class="modal fade" id="careerModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title" id="modalTitle" data-i18n="admin:careers.btn_add">Add Career</h5>
            </div>
            <div class="modal-body">
                <form id="careerForm">
                    <input type="hidden" id="cId">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Career Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="cName" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Skill Domain</label>
                            <input type="text" class="form-control" id="cDomain">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Description</label>
                        <textarea class="form-control" id="cDesc" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Course/Training Information</label>
                        <textarea class="form-control" id="cCourse" rows="2"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Required Traits (JSON array format)</label>
                            <input type="text" class="form-control" id="cTraits" placeholder='["Creative", "Analytical"]'>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Job Roles (JSON array format)</label>
                            <input type="text" class="form-control" id="cRoles" placeholder='["Designer", "Developer"]'>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- i18next -->
    <script src="/admin/assets/vendor/i18next/i18next.min.js"></script>
    <script src="/admin/assets/vendor/i18next/i18nextHttpBackend.min.js"></script>
    <script src="/admin/assets/vendor/i18next/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="/admin/assets/vendor/i18next/loc-i18next.min.js"></script>
    <script src="/admin/assets/js/i18n-config.js"></script>
    <script src="../assets/js/admin-api.js"></script>
<script src="../assets/js/admin-shared.js"></script>
<script src="careers.js"></script>
</body>
</html>

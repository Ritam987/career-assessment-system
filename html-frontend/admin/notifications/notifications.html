    <style>
        /* Notifications specific styles */
        .notif-panel {
            max-width: 900px;
            margin: 0 auto;
        }
        .notif-tabs {
            display: flex; gap: 20px;
            padding: 0 16px; border-bottom: 1px solid var(--border);
        }
        .n-tab {
            padding: 12px 0; font-size: .85rem; font-weight: 600;
            color: var(--text-sub); text-decoration: none; position: relative;
            cursor: pointer;
        }
        .n-tab:hover { color: var(--purple); }
        .n-tab.active { color: var(--purple); }
        .n-tab.active::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
            height: 2px; background: var(--purple); border-radius: 2px 2px 0 0;
        }
        .n-badge {
            background: var(--purple-lt); color: var(--purple);
            padding: 2px 6px; border-radius: 20px; font-size: .65rem; margin-left: 4px;
        }

        .notif-list { display: flex; flex-direction: column; }
        
        .notif-item {
            display: flex; gap: 16px; padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            transition: background .15s;
            text-decoration: none; color: inherit;
        }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: #fafbff; }
        
        /* Unread styling */
        .notif-item.unread { background: #f8faff; }
        .notif-item.unread:hover { background: #f1f5ff; }
        .notif-item.unread .n-title { font-weight: 700; color: var(--text); }
        
        .n-icon {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .ni-purple { background: var(--purple-lt); color: var(--purple); }
        .ni-green  { background: #dcfce7; color: #059669; }
        .ni-blue   { background: #dbeafe; color: #2563eb; }
        .ni-amber  { background: #fef3c7; color: #d97706; }

        .n-body { flex: 1; min-width: 0; }
        .n-title { font-size: .88rem; font-weight: 600; color: var(--text); margin-bottom: 3px; }
        .n-desc { font-size: .8rem; color: var(--text-sub); line-height: 1.4; margin-bottom: 6px; }
        .n-time { font-size: .7rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        
        .n-status {
            width: 10px; display: flex; align-items: center; justify-content: center;
        }
        .unread-dot {
            width: 8px; height: 8px; background: var(--purple); border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(91,33,182,.15);
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin-base.css">
    <link rel="stylesheet" href="questions.css">
</head>
<body>
<div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="../../assets/images/logo.jpg" alt="Logo" class="brand-logo-sm">
            <div class="brand-text">
                <div class="brand-name" data-i18n="common:career_assessment">Career Assessment</div>
                <div class="brand-role"><span class="admin-dot"></span><span data-i18n="admin:sidebar.admin_portal">Admin Portal</span></div>
            </div>
        </div>
        <div id="sidebarNav"></div>
        <div class="sidebar-footer">
            <a href="../../login/login.html" class="nav-item logout" data-tip="Logout">
                <i class="bi bi-box-arrow-right"></i>
                <span class="nav-lbl" data-i18n="admin:sidebar.logout">Logout</span>
            </a>
        </div>
    </aside>
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="openSidebar()"><i class="bi bi-list"></i></button>
                <button class="collapse-btn" onclick="toggleCollapse()"><i class="bi bi-layout-sidebar"></i></button>
                <span class="topbar-title" data-i18n="admin:sidebar.questions">Questions</span>
            </div>
            <div class="topbar-right">
                <a href="../notifications/notifications.html" class="icon-btn text-decoration-none" title="Notifications"><i class="bi bi-bell"></i></a>
                <div class="dropdown">
                    <div class="user-chip" data-bs-toggle="dropdown" style="cursor:pointer;">
                        <div class="user-avatar">A</div>
                        <div class="user-info"><div class="u-name admin-name">Admin</div><div class="u-role"><span data-i18n="admin:sidebar.super_admin">Super Admin</span></div></div>
                    </div>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1" data-i18n="admin:questions.title">Question Management</h2>
                    <p class="text-muted mb-0" data-i18n="admin:questions.subtitle">View and organize assessment questions.</p>
                </div>
                
            </div>
            
            <div class="panel">
                <div class="panel-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="questionsTable">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th data-i18n="admin:questions.table_question">Question</th>
                                    <th data-i18n="admin:questions.table_category">Category</th>
                                    <th data-i18n="admin:questions.table_type">Type</th>
                                    <th data-i18n="common:status">Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="5" class="text-center py-4"><span data-i18n="common:loading">Loading...</span></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- i18next -->
    <script src="/admin/assets/vendor/i18next/i18next.min.js"></script>
    <script src="/admin/assets/vendor/i18next/i18nextHttpBackend.min.js"></script>
    <script src="/admin/assets/vendor/i18next/i18nextBrowserLanguageDetector.min.js"></script>
    <script src="/admin/assets/vendor/i18next/loc-i18next.min.js"></script>
    <script src="/admin/assets/js/i18n-config.js"></script>
    <script src="../assets/js/admin-api.js"></script>
<script src="../assets/js/admin-shared.js"></script>
<script src="questions.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin-base.css">
    <link rel="stylesheet" href="questions.css">
</head>
<body>
<div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="../../assets/images/logo.jpg" alt="Logo" class="brand-logo-sm">
            <div class="brand-text">
                <div class="brand-name">Career Assessment</div>
                <div class="brand-role"><span class="admin-dot"></span>Admin Portal</div>
            </div>
        </div>
        <div id="sidebarNav"></div>
        <div class="sidebar-footer">
            <a href="../../login/login.html" class="nav-item logout" data-tip="Logout">
                <i class="bi bi-box-arrow-right"></i>
                <span class="nav-lbl">Logout</span>
            </a>
        </div>
    </aside>
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="openSidebar()"><i class="bi bi-list"></i></button>
                <button class="collapse-btn" onclick="toggleCollapse()"><i class="bi bi-layout-sidebar"></i></button>
                <span class="topbar-title">Questions</span>
            </div>
            <div class="topbar-right">
                <a href="../notifications/notifications.html" class="icon-btn text-decoration-none" title="Notifications"><i class="bi bi-bell"></i></a>
                <div class="dropdown">
                    <div class="user-chip" data-bs-toggle="dropdown" style="cursor:pointer;">
                        <div class="user-avatar">A</div>
                        <div class="user-info"><div class="u-name admin-name">Admin</div><div class="u-role">Super Admin</div></div>
                    </div>
                </div>
            </div>
        </header>
        <div class="content">
            <div class="page-header d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-1">Question Management</h2>
                    <p class="text-muted mb-0">Add, edit, and organize assessment questions.</p>
                </div>
                <button class="btn btn-primary" onclick="openAddModal()">
                    <i class="bi bi-plus-lg me-1"></i> Add Question
                </button>
            </div>
            
            <div class="panel">
                <div class="panel-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="questionsTable">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Question</th>
                                    <th>Category</th>
                                    <th>Type</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="6" class="text-center py-4">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Question Modal -->
<div class="modal fade" id="questionModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title" id="modalTitle">Add Question</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="questionForm">
                    <input type="hidden" id="qId">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Question Text <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="qText" rows="2" required></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Category ID <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="qCategory" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Question Type</label>
                            <select class="form-select" id="qType">
                                <option value="Likert">Likert</option>
                                <option value="Multiple Choice">Multiple Choice</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Mapped Trait</label>
                            <input type="text" class="form-control" id="qTrait">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Status</label>
                            <select class="form-select" id="qStatus">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    
                    <h6 class="mt-4 mb-3 fw-bold">Options & Scoring</h6>
                    <div class="row mb-2">
                        <div class="col-md-8">
                            <input type="text" class="form-control" id="qOptA" placeholder="Option A (e.g. Strongly Agree)">
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control" id="qScoreA" placeholder="Score A">
                        </div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-8">
                            <input type="text" class="form-control" id="qOptB" placeholder="Option B (e.g. Agree)">
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control" id="qScoreB" placeholder="Score B">
                        </div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-md-8">
                            <input type="text" class="form-control" id="qOptC" placeholder="Option C (e.g. Disagree)">
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control" id="qScoreC" placeholder="Score C">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <input type="text" class="form-control" id="qOptD" placeholder="Option D (e.g. Strongly Disagree)">
                        </div>
                        <div class="col-md-4">
                            <input type="number" class="form-control" id="qScoreD" placeholder="Score D">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top-0 pt-0">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="btnSaveQuestion" onclick="saveQuestion()">Save Question</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/admin-api.js"></script>
<script src="../assets/js/admin-shared.js"></script>
<script src="questions.js"></script>
</body>
</html>

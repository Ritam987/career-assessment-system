<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redo Requests — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin-base.css">
    <style>
        /* Notifications specific styles */
        .notif-panel {
            max-width: 900px;
            margin: 0 auto;
        }
        .notif-tabs {
            display: flex; gap: 20px;
            padding: 0 16px; border-bottom: 1px solid var(--border);
        }
        .n-tab {
            padding: 12px 0; font-size: .85rem; font-weight: 600;
            color: var(--text-sub); text-decoration: none; position: relative;
            cursor: pointer;
        }
        .n-tab:hover { color: var(--purple); }
        .n-tab.active { color: var(--purple); }
        .n-tab.active::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
            height: 2px; background: var(--purple); border-radius: 2px 2px 0 0;
        }
        .n-badge {
            background: var(--purple-lt); color: var(--purple);
            padding: 2px 6px; border-radius: 20px; font-size: .65rem; margin-left: 4px;
        }

        .notif-list { display: flex; flex-direction: column; }
        
        .notif-item {
            display: flex; gap: 16px; padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            transition: background .15s;
            text-decoration: none; color: inherit;
        }
        .notif-item:last-child { border-bottom: none; }
        .notif-item:hover { background: #fafbff; }
        
        /* Unread styling */
        .notif-item.unread { background: #f8faff; }
        .notif-item.unread:hover { background: #f1f5ff; }
        .notif-item.unread .n-title { font-weight: 700; color: var(--text); }
        
        .n-icon {
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0;
        }
        .ni-purple { background: var(--purple-lt); color: var(--purple); }
        .ni-green  { background: #dcfce7; color: #059669; }
        .ni-blue   { background: #dbeafe; color: #2563eb; }
        .ni-amber  { background: #fef3c7; color: #d97706; }

        .n-body { flex: 1; min-width: 0; }
        .n-title { font-size: .88rem; font-weight: 600; color: var(--text); margin-bottom: 3px; }
        .n-desc { font-size: .8rem; color: var(--text-sub); line-height: 1.4; margin-bottom: 6px; }
        .n-time { font-size: .7rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
        
        .n-status {
            width: 10px; display: flex; align-items: center; justify-content: center;
        }
        .unread-dot {
            width: 8px; height: 8px; background: var(--purple); border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(91,33,182,.15);
        }
    </style>
    <style>
        .request-card { background: #fff; border-radius: 8px; border: 1px solid #e5e7eb; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .request-hdr { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .req-user { font-weight: 600; font-size: 1.1rem; color: #111827; }
        .req-email { color: #6b7280; font-size: 0.9rem; margin-top: 2px; }
        .req-meta { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
        .meta-item { background: #f3f4f6; padding: 6px 12px; border-radius: 4px; font-size: 0.85rem; color: #374151; }
        .req-reason { background: #fdfcf8; border-left: 4px solid #f59e0b; padding: 12px; font-size: 0.95rem; color: #4b5563; border-radius: 0 4px 4px 0; margin-bottom: 16px; }
        .req-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; border-top: 1px solid #e5e7eb; padding-top: 16px; }
        .badge-status { padding: 4px 8px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .status-PENDING { background: #fef3c7; color: #92400e; }
        .status-APPROVED { background: #d1fae5; color: #065f46; }
        .status-REJECTED { background: #fee2e2; color: #b91c1c; }
        .comment-box { width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 8px; margin-bottom: 12px; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <img src="../../assets/images/logo.jpg" alt="Logo" class="brand-logo-sm">
            <div class="brand-text">
                <div class="brand-name">Career Assessment</div>
                <div class="brand-role"><span class="admin-dot"></span>Admin Portal</div>
            </div>
        </div>
        <div id="sidebarNav"></div>
        <div class="sidebar-footer">
            <a href="../../login/login.html" class="nav-item logout" data-tip="Logout">
                <i class="bi bi-box-arrow-right"></i>
                <span class="nav-lbl">Logout</span>
            </a>
        </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" onclick="openSidebar()"><i class="bi bi-list"></i></button>
                <button class="collapse-btn" onclick="toggleCollapse()"><i class="bi bi-layout-sidebar"></i></button>
                <span class="topbar-title">Redo Requests</span>
            </div>
            <div class="topbar-right">
                <div class="search-bar d-none d-md-flex">
                    <i class="bi bi-search"></i>
                    <input type="text" placeholder="Search...">
                </div>
                <div class="dropdown">
                    <div class="icon-btn" data-bs-toggle="dropdown" style="cursor:pointer;" title="Translate">
                        <i class="bi bi-translate"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="border-radius:10px;font-size:.85rem;margin-top:8px;">
                        <li><a class="dropdown-item fw-bold" style="color:var(--purple);" href="#">English</a></li>
                        <li><a class="dropdown-item" href="#">हिंदी (Hindi)</a></li>
                        <li><a class="dropdown-item" href="#">বাংলা (Bengali)</a></li>
                    </ul>
                </div>
                <a href="notifications.html" class="icon-btn text-decoration-none" title="Notifications"><i class="bi bi-bell"></i><span class="notif-dot"></span></a>
                <div class="dropdown">
                    <div class="user-chip" data-bs-toggle="dropdown" style="cursor:pointer;">
                        <div class="user-avatar">A</div>
                        <div class="user-info"><div class="u-name">Admin</div><div class="u-role">Super Admin</div></div>
                        <i class="bi bi-chevron-down" style="font-size:.6rem;color:var(--text-muted);margin-left:2px;"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0" style="border-radius:10px;font-size:.85rem;margin-top:8px;">
                        <li><a class="dropdown-item" href="../profile/profile.html"><i class="bi bi-person me-2"></i>My Profile</a></li>
                        <li><a class="dropdown-item" href="../settings/settings.html"><i class="bi bi-gear me-2"></i>Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="../../login/login.html"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <main class="content" id="main-content">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h4 class="mb-0 fw-bold">Redo Requests</h4>
            <span class="text-muted" id="requestCount">Loading...</span>
        </div>
        
        <!-- Filters -->
        <div class="mb-4 d-flex gap-2">
            <button class="btn btn-sm btn-primary filter-btn" data-status="ALL">All</button>
            <button class="btn btn-sm btn-outline-primary filter-btn" data-status="PENDING">Pending</button>
            <button class="btn btn-sm btn-outline-primary filter-btn" data-status="APPROVED">Approved</button>
            <button class="btn btn-sm btn-outline-primary filter-btn" data-status="REJECTED">Rejected</button>
        </div>

        <div id="requestsContainer">
            <!-- Populated by JS -->
        </div>
    </main>
    </div>
</div>

    <!-- Modals -->
    <div class="modal fade" id="actionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Review Request</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="modalConfirmText">Are you sure?</p>
                    <textarea id="adminComment" class="form-control" rows="3" placeholder="Add a comment (required for rejection)..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn" id="confirmActionBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/admin-api.js"></script>
<script src="../assets/js/admin-shared.js"></script>

<!-- Google Translate Integration -->
<script src="../../assets/js/translate.js"></script>
<script src="redo-requests.js"></script>
</body>
</html>
